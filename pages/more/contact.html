    <body>
        <div id="wrap">
            <header id="header"></header>

            <main>
                <!--  서브 네비 & 서브 헤더 -->
                <section class="sub-header">
                    <div class="sub-header-wrapper">
                        <div class="sub-nav">
                            <a href="/"><i data-lucide="house" class="size-4 text-yellow-500"></i></a>
                            <img src="/assets/images/icon/triangle.svg" class="w-1 object-contain" alt="다음" />
                            <span>더보기</span>
                            <img src="/assets/images/icon/triangle.svg" class="w-1 object-contain" alt="다음" />
                            <a href="/pages/contact.html">문의하기</a>
                        </div>

                        <h2 class="sub-header-title">문의하기</h2>
                        <hr class="sub-header-line" />
                    </div>
                </section>
                <!--  문의하기  -->
                <section class="px-5">
                    <div
                        class="mx-auto grid max-w-400 grid-cols-1 gap-10 pb-12 md:pb-30 lg:grid-cols-[minmax(0,1fr)_500px] lg:gap-5 2xl:gap-16"
                    >
                        <div
                            class="w-full bg-blue-500 bg-[url(/assets/images/background/faq_bg_t.png),url(/assets/images/background/faq_bg.png)] bg-size-[600px_auto,600px_auto] bg-position-[top_left,bottom_right] px-7 py-9 text-white md:bg-size-[auto,auto] md:px-11 md:py-15 2xl:bg-size-[auto,1024px_auto]"
                        >
                            <form action="#" method="post" class="flex flex-col gap-5 md:gap-9">
                                <h2 class="text-xl font-bold md:text-2xl">문의하기</h2>
                                <div class="flex flex-col border-b border-white/50 text-sm md:text-lg">
                                    <label for="user-name" class="font-bold">
                                        성함
                                        <span class="text-yellow-500" aria-hidden="true">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        id="user-name"
                                        name="username"
                                        class="py-3"
                                        placeholder="성함"
                                        required
                                    />
                                </div>
                                <div class="flex flex-col border-b border-white/50 text-sm md:text-lg">
                                    <label for="user-tel" class="font-bold">
                                        연락처
                                        <span class="text-yellow-500" aria-hidden="true">*</span>
                                    </label>
                                    <input
                                        type="tel"
                                        id="user-tel"
                                        name="usertel"
                                        class="py-3"
                                        placeholder="연락처"
                                        required
                                    />
                                </div>
                                <div class="flex flex-col border-b border-white/50 text-sm md:text-lg">
                                    <label for="user-email" class="font-bold">
                                        이메일
                                        <span class="text-yellow-500" aria-hidden="true">*</span>
                                    </label>
                                    <input
                                        type="email"
                                        id="user-email"
                                        name="useremail"
                                        class="py-3"
                                        placeholder="이메일"
                                        required
                                    />
                                </div>
                                <div class="flex flex-col border-b border-white/50 text-sm md:text-lg">
                                    <label for="contact-text" class="font-bold">
                                        문의 내용
                                        <span class="text-yellow-500" aria-hidden="true">*</span>
                                    </label>
                                    <textarea
                                        placeholder="문의하실 내용을 입력해주세요"
                                        id="contact-text"
                                        rows="4"
                                        class="resize-none py-3"
                                        name="contact-content"
                                        required
                                    ></textarea>
                                </div>
                                <div
                                    class="flex flex-col items-center gap-4 2xl:flex-row 2xl:items-stretch 2xl:justify-between"
                                >
                                    <div class="flex flex-row items-center gap-2 text-sm md:text-base">
                                        <label
                                            for="privacy_cbx"
                                            class="flex cursor-pointer flex-row items-center gap-2"
                                        >
                                            <input
                                                type="checkbox"
                                                name="privacy_cbx"
                                                id="privacy_cbx"
                                                class="peer sr-only"
                                            />
                                            <span
                                                class="flex-center size-5 rounded border bg-blue-500 transition-colors peer-checked:border-0 peer-checked:bg-yellow-500 peer-checked:[&>svg]:block"
                                            >
                                                <i data-lucide="check" class="hidden stroke-2 text-blue-500"></i>
                                            </span>

                                            <span>개인정보 수집 및 이용에 동의합니다.</span>
                                        </label>
                                        <span
                                            class="cursor-pointer underline"
                                            data-modal-open
                                            data-modal-title="개인정보 이용 동의"
                                            data-modal-target="#privacy-template"
                                        >
                                            보기
                                        </span>
                                    </div>
                                    <button
                                        type="submit"
                                        class="btn-shape bg-white text-blue-500 hover:bg-transparent hover:text-white"
                                    >
                                        제출하기
                                    </button>
                                </div>
                            </form>
                        </div>
                        <!--  명함  -->
                        <div class="grid w-full grid-cols-1 gap-6 lg:gap-10">

                                </div>
                            </div>

                                    <address class="not-italic">
                                        (04533) 서울특별시 중구 남대문로7길 16, 4층 408호 (소공동, 소공 한국빌딩)
                                    </address>

                                    <span>Tel. 02-584-5494</span>
                                </div>
